# Engineering decision: 1.9GB RAM build machines — Gradle heap capped and Kotlin runs
# in-process inside the Gradle daemon to avoid a second JVM being OOM-killed.
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx350m
android.useAndroidX=true
android.nonTransitiveRClass=true
